# Required repo setting (one-time):
#   Settings → Actions → General → Workflow permissions →
#     enable "Allow GitHub Actions to create and approve pull requests"
#
# Without it, the first `standing-pr update` run will fail with HTTP 403.
# See packages/release/docs/ci-setup.md → Standing Release PR for the full guide.
#
# Tip: exempt this PR's branch (release/*) from your build/test CI, or every update
# re-runs your whole matrix. See ci-setup.md → "Keeping CI off the standing PR".

name: Standing Release PR

on:
  push:
    branches: [main] # Should match git.branch in releasekit.config.json
  pull_request:
    types: [closed, labeled, unlabeled, edited]
    branches: [main]
  schedule:
    - cron: '0 * * * *' # re-evaluates the minAge status check as time passes

concurrency:
  # One shared group serializes publish (merge closed) against push/schedule updates so branch delete cannot race a new release branch.
  # Maintainer checkbox edits cancel in-flight rebuilds per PR via a dedicated edit group.
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.sender.type != 'Bot' && format('standing-release-pr-edit-{0}', github.event.pull_request.number) || 'standing-release-pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.sender.type != 'Bot' }}

permissions:
  contents: write
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  update-release-pr:
    name: Update Release PR
    # `sender.type != 'Bot'` is load-bearing: the update rewrites the PR body (an `edited` event), so
    # the bot would otherwise re-trigger itself forever. Matching on type rather than the
    # `github-actions[bot]` login also filters a custom GitHub App token. The `release/` prefix is
    # hardcoded (workflow `if` can't read config) - in-step config is authoritative.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'pull_request' &&
        (
          github.event.action == 'labeled' ||
          github.event.action == 'unlabeled' ||
          github.event.action == 'edited'
        ) &&
        github.event.pull_request.state == 'open' &&
        startsWith(github.event.pull_request.head.ref, 'release/') &&
        github.event.sender.type != 'Bot'
      )
    runs-on: ubuntu-latest
    steps:
      # Instant banner so a maintainer knows their tick or label change was received while the slower
      # rebuild runs. Before checkout so it lands within seconds of the runner starting.
      - name: Acknowledge the update in progress
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          case "$BODY" in
            *'<!-- releasekit-processing -->'*) echo "Banner already present — skipping"; exit 0 ;;
          esac
          BANNER=$'<!-- releasekit-processing -->\n> 🔄 **Updating the release PR** to reflect your change… ([run details]('"$RUN_URL"$'))\n<!-- releasekit-processing-end -->'
          NEWBODY=$(printf '%s\n\n%s' "$BANNER" "$BODY")
          gh api --method PATCH "repos/$REPO/pulls/$PR" -f body="$NEWBODY" >/dev/null

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      # Using npm? Replace the line above with: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update standing release PR
        run: pnpm exec releasekit standing-pr update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # LLM key only needed when using the release:preview-notes label (optional).
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # Only a run that ended before the rebuild leaves the banner behind. `cancelled()` covers a manual
      # cancel or a superseded reactive run.
      - name: Clear the in-progress banner if the update didn't finish
        if: (failure() || cancelled()) && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/$REPO/pulls/$PR" --jq '.body // ""')
          CLEANED=$(printf '%s' "$BODY" | sed '/<!-- releasekit-processing -->/,/<!-- releasekit-processing-end -->/d')
          gh api --method PATCH "repos/$REPO/pulls/$PR" -f body="$CLEANED" >/dev/null

  immediate-release:
    # Bypasses the standing PR queue when a feeder PR carrying `release:immediate`
    # (configurable via `ci.labels.immediate`) merges to main.
    name: Immediate Release (bypass standing PR)
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release:immediate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      # Using npm? Replace the line above with: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Direct release (bypassing standing PR)
        run: pnpm exec releasekit release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # NODE_AUTH_TOKEN unnecessary with OIDC trusted publishing. With token-based
          # npm auth, uncomment the next line:
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provider key for LLM-enhanced release notes (uncomment your provider):
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      - name: Reconcile standing PR
        # Not `standing-pr update`: HEAD is now a `chore: release …` commit, which the skip-pattern
        # guard matches, so a plain update no-ops. refresh-after-release bypasses the guard and also
        # refreshes stale feeder-PR previews.
        run: pnpm exec releasekit refresh-after-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  publish-release:
    name: Publish Release
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      # Using npm? Replace the line above with: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish from release PR
        run: pnpm exec releasekit standing-pr publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # NODE_AUTH_TOKEN unnecessary with OIDC trusted publishing. With token-based
          # npm auth, uncomment the next line:
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provider key for LLM-enhanced release notes (uncomment your provider):
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
