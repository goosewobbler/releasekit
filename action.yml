name: ReleaseKit – Automated Versioning & Release
description: Run ReleaseKit in preview or release mode
author: goosewobbler

branding:
  icon: package
  color: green

inputs:
  mode:
    description: Action mode (release, preview, gate, standing-pr-update, standing-pr-publish, backfill, or refresh-after-release)
    required: false
    default: preview
  config:
    description: Path to releasekit config file
    required: false
  project-dir:
    description: Project directory to run in
    required: false
    default: .
  dry-run:
    description: Dry-run for release, preview and backfill; other modes fail if it's set
    required: false
    default: 'false'
  json:
    description: Enable JSON output (release mode)
    required: false
    default: 'false'
  verbose:
    description: Enable verbose logging
    required: false
    default: 'false'
  quiet:
    description: Suppress non-error output
    required: false
    default: 'false'
  skip-checkout:
    description: 'Skip repository checkout (assume repo is already checked out). WARNING: Ensure repository has full git history (fetch-depth: 0) for proper version-bumping logic. Shallow clones may cause incorrect version bumps or silent failures.'
    required: false
    default: 'false'

  bump:
    description: Force bump type (patch|minor|major|prerelease)
    required: false
  prerelease:
    description: Create prerelease version (optional identifier)
    required: false
  stable:
    description: Graduate prerelease packages to stable without bumping
    required: false
    default: 'false'
  sync:
    description: Use synchronized versioning
    required: false
    default: 'false'
  target:
    description: Target packages (comma-separated)
    required: false
  scope:
    description: Scope name to resolve to target packages from ci.scopeLabels config
    required: false
  branch:
    description: Override git branch used for push
    required: false
  node-version:
    description: Node.js version
    required: false
    default: '24'
  github-token:
    description: GitHub token for API calls and git pushes (defaults to the workflow token)
    required: false
    default: ${{ github.token }}
  npm-auth:
    description: NPM auth method (auto|oidc|token)
    required: false
    default: auto
  npm-token:
    description: npm token for publishing without OIDC (defaults to the job's NPM_TOKEN)
    required: false
  skip-notes:
    description: Skip changelog generation
    required: false
    default: 'false'
  skip-publish:
    description: Skip registry publishing and git operations
    required: false
    default: 'false'
  skip-git:
    description: Skip git commit/tag/push
    required: false
    default: 'false'
  skip-github-release:
    description: Skip GitHub release creation
    required: false
    default: 'false'
  skip-verification:
    description: Skip post-publish verification
    required: false
    default: 'false'
  ssh-key:
    description: SSH deploy key for git pushes, used instead of github-token
    required: false

  reconcile:
    description: 'Bypass the skip-pattern guard in standing-pr-update mode (for post-release reconcile runs, where HEAD is a release commit)'
    required: false
    default: 'false'

  pr:
    description: Pull request number (preview mode; standing-pr-publish mode when not triggered by a pull_request event)
    required: false
  repo:
    description: Repository in owner/repo format (preview mode)
    required: false
  preview-prerelease:
    description: Force prerelease preview (optional identifier)
    required: false
  preview-stable:
    description: Force stable preview
    required: false
    default: 'false'
  preview-dry-run:
    description: Print preview markdown without posting
    required: false
    default: 'false'
  preview-target:
    description: Target packages in preview mode (comma-separated)
    required: false
  summary:
    description: Write GITHUB_STEP_SUMMARY markdown
    required: false
    default: 'true'

  package:
    description: Package to backfill (backfill mode; defaults to the package.json name at `path`)
    required: false
  path:
    description: Package directory to backfill (backfill mode)
    required: false
  all:
    description: Backfill every package in the workspace (backfill mode)
    required: false
    default: 'false'
  from:
    description: Earliest version to backfill, inclusive (backfill mode)
    required: false
  to:
    description: Latest version to backfill, inclusive (backfill mode)
    required: false
  update-releases:
    description: Update matching GitHub release bodies via `gh release edit` (backfill mode)
    required: false
    default: 'false'
  only-missing:
    description: With update-releases, skip releases already carrying releasekit notes (backfill mode)
    required: false
    default: 'false'
  apply:
    description: Apply changes instead of a dry-run preview (backfill mode)
    required: false
    default: 'false'

outputs:
  success:
    description: Whether action completed successfully
    value: ${{ steps.run.outputs.success }}
  mode:
    description: Executed mode
    value: ${{ steps.run.outputs.mode }}
  standing-pr-action:
    description: Standing PR action taken (created, updated, closed, or noop)
    value: ${{ steps.run.outputs.standing-pr-action }}
  standing-pr-number:
    description: Standing PR number
    value: ${{ steps.run.outputs.standing-pr-number }}
  standing-pr-url:
    description: Standing PR URL
    value: ${{ steps.run.outputs.standing-pr-url }}
  should-release:
    description: Whether a release should proceed (gate mode)
    value: ${{ steps.run.outputs.should-release }}
  bump:
    description: Resolved bump type (gate mode)
    value: ${{ steps.run.outputs.bump }}
  gate-scope:
    description: Resolved scope name (gate mode)
    value: ${{ steps.run.outputs.gate-scope }}
  gate-target:
    description: Resolved target packages (gate mode)
    value: ${{ steps.run.outputs.gate-target }}
  gate-stable:
    description: Whether the release should be a stable graduation (gate mode, release:graduate label)
    value: ${{ steps.run.outputs.gate-stable }}
  has-changes:
    description: 'Whether a release has changes (release mode, requires json: true)'
    value: ${{ steps.run.outputs.has-changes }}
  version-output:
    description: Version output JSON (release mode)
    value: ${{ steps.run.outputs.version-output }}
  tags:
    description: Comma-separated tags (release mode)
    value: ${{ steps.run.outputs.tags }}
  release-output:
    description: Full release output JSON (release mode)
    value: ${{ steps.run.outputs.release-output }}
  preview-markdown:
    description: Preview markdown (preview mode with dry-run)
    value: ${{ steps.run.outputs.preview-markdown }}
  preview-posted:
    description: Whether preview was posted (preview mode, non-dry-run)
    value: ${{ steps.run.outputs.preview-posted }}

runs:
  using: composite
  steps:
    # Push credentials (the SSH key or github-token) are persisted only for a run that pushes, so a PR preview's
    # later steps can't read them. An applied backfill counts: a follow-up step commits its files.
    - name: Resolve push access
      id: access
      shell: bash
      run: |
        lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
        case "$INPUT_MODE" in
          release | standing-pr-update | standing-pr-publish | refresh-after-release) pushes=true ;;
          backfill) [ "$(lower "$INPUT_APPLY")" = true ] && pushes=true || pushes=false ;;
          *) pushes=false ;;
        esac
        [ "$(lower "$INPUT_DRY_RUN")" = true ] && pushes=false
        echo "pushes=$pushes" >> "$GITHUB_OUTPUT"
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_APPLY: ${{ inputs.apply }}

    - name: Checkout (SSH)
      if: ${{ inputs.skip-checkout != 'true' && inputs.ssh-key != '' && steps.access.outputs.pushes == 'true' }}
      uses: actions/checkout@v7
      with:
        ssh-key: ${{ inputs.ssh-key }}
        fetch-depth: 0

    - name: Checkout (HTTPS)
      if: ${{ inputs.skip-checkout != 'true' && (inputs.ssh-key == '' || steps.access.outputs.pushes != 'true') }}
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # An empty input (a secret unset on a fork run) falls back to the workflow token.
        token: ${{ steps.access.outputs.pushes == 'true' && inputs.github-token || github.token }}

    # pnpm/action-setup fails if given a version that differs from the repo's pin, so only a repo with no pin
    # (npm, Dart or Rust) gets the action's own. Without Node yet, a packageManager grep stands in for the check.
    - name: Resolve pnpm setup
      id: pnpm-setup
      shell: bash
      run: |
        manifest="$GITHUB_WORKSPACE/package.json"
        pinned=false
        if command -v node >/dev/null; then
          node -e '
            const m = require(process.argv[1]);
            const d = m.devEngines?.packageManager;
            process.exit(String(m.packageManager).startsWith("pnpm@") || (d?.name === "pnpm" && d.version) ? 0 : 1);
          ' "$manifest" 2>/dev/null && pinned=true
        else
          grep -Eqs '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' "$manifest" && pinned=true
        fi
        if [ "$pinned" != true ]; then
          echo "version=$(sed -nE 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@([^"+]*).*/\1/p' "$GITHUB_ACTION_PATH/package.json")" >> "$GITHUB_OUTPUT"
        fi
        # Only a pnpm lockfile can key setup-node's cache.
        if [ -f "$GITHUB_WORKSPACE/pnpm-lock.yaml" ]; then
          echo "cache=pnpm" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm-setup.outputs.version }}

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.pnpm-setup.outputs.cache }}
        package-manager-cache: false

    - name: Install action runtime deps
      run: pnpm install --frozen-lockfile
      working-directory: ${{ github.action_path }}
      shell: bash

    - name: Fetch and sync remote (skip-checkout)
      if: ${{ inputs.skip-checkout == 'true' }}
      run: |
        CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
        if [ "$CURRENT_BRANCH" = "HEAD" ]; then
          echo "Error: repository is in detached HEAD state; cannot sync remote branch."
          exit 1
        fi
        git config core.hooksPath /dev/null
        git fetch origin
        if [ -n "$(git status --porcelain)" ]; then
          git stash push -u -m "temp stash for releasekit"
          git rebase "origin/$CURRENT_BRANCH" || { git rebase --abort 2>/dev/null || true; echo "Warning: rebase failed; falling back to git reset --hard. Local commits ahead of origin will be discarded."; git reset --hard "origin/$CURRENT_BRANCH"; }
          git stash pop || { echo "Stash pop failed, resetting to clean working tree. Stashed changes remain available."; git reset --hard; exit 1; }
        else
          git rebase "origin/$CURRENT_BRANCH" || { git rebase --abort 2>/dev/null || true; echo "Warning: rebase failed; falling back to git reset --hard. Local commits ahead of origin will be discarded."; git reset --hard "origin/$CURRENT_BRANCH"; }
        fi
        git config --unset core.hooksPath || true
      shell: bash
      working-directory: ${{ inputs.project-dir || '.' }}

    - name: Configure git
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
      shell: bash

    - name: Run ReleaseKit action
      id: run
      shell: bash
      working-directory: ${{ inputs.project-dir || '.' }}
      run: |
        echo "Current directory: $(pwd)"
        echo "Git status:"
        git status --porcelain || echo "Not a git repository"
        echo "Git config:"
        git config --list --local | head -10
        echo "Environment:"
        echo "INPUT_TARGET: $INPUT_TARGET"
        echo "INPUT_DRY_RUN: $INPUT_DRY_RUN"
        echo "INPUT_JSON: $INPUT_JSON"
        echo "Running ReleaseKit with verbose output..."
        set -x
        node ${{ github.action_path }}/scripts/run-action.mjs
        exit_code=$?
        set +x
        if [ $exit_code -ne 0 ]; then
          echo "ReleaseKit failed with exit code: $exit_code"
          echo "Checking for common issues..."
          echo "Git status after failure:"
          git status --porcelain
          echo "Recent commits:"
          git log --oneline -5 2>/dev/null || echo "Could not get git log"
          echo "Package.json exists:"
          ls -la package.json || echo "package.json not found"
          echo "Node version:"
          node --version
          echo "PNPM version:"
          pnpm --version 2>/dev/null || echo "pnpm not found"
          exit 1
        fi
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROJECT_DIR: ${{ inputs.project-dir }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_JSON: ${{ inputs.json }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_QUIET: ${{ inputs.quiet }}
        INPUT_BUMP: ${{ inputs.bump }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_STABLE: ${{ inputs.stable }}
        INPUT_SYNC: ${{ inputs.sync }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_NPM_AUTH: ${{ inputs.npm-auth }}
        INPUT_NPM_TOKEN: ${{ inputs.npm-token }}
        INPUT_SKIP_NOTES: ${{ inputs.skip-notes }}
        INPUT_SKIP_PUBLISH: ${{ inputs.skip-publish }}
        INPUT_SKIP_GIT: ${{ inputs.skip-git }}
        INPUT_SKIP_GITHUB_RELEASE: ${{ inputs.skip-github-release }}
        INPUT_SKIP_VERIFICATION: ${{ inputs.skip-verification }}
        INPUT_RECONCILE: ${{ inputs.reconcile }}
        INPUT_PR: ${{ inputs.pr }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PREVIEW_PRERELEASE: ${{ inputs.preview-prerelease }}
        INPUT_PREVIEW_STABLE: ${{ inputs.preview-stable }}
        INPUT_PREVIEW_DRY_RUN: ${{ inputs.preview-dry-run }}
        INPUT_PREVIEW_TARGET: ${{ inputs.preview-target }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_FROM: ${{ inputs.from }}
        INPUT_TO: ${{ inputs.to }}
        INPUT_UPDATE_RELEASES: ${{ inputs.update-releases }}
        INPUT_ONLY_MISSING: ${{ inputs.only-missing }}
        INPUT_APPLY: ${{ inputs.apply }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        # gh prefers GH_TOKEN over GITHUB_TOKEN.
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        VERBOSE: ${{ inputs.verbose }}
        OLLAMA_API_KEY: ${{ env.OLLAMA_API_KEY }}
