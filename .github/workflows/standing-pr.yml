name: Standing Release PR

on:
  push:
    branches: [main]
  pull_request:
    types: [closed, labeled, unlabeled]
    branches: [main]
  workflow_dispatch: {}

# `push` and `workflow_dispatch` runs (publish dispatch, update-release-pr) must serialize, so they
# share a group; splitting them would let a manual re-trigger race an in-flight push run.
# `pull_request` runs get their own group: GitHub keeps only the latest pending run per group, so
# one could supersede a queued publish-dispatch push run and silently drop the publish.
# See https://github.com/goosewobbler/releasekit/issues/322
concurrency:
  group: standing-release-pr-${{ github.event_name == 'pull_request' && 'pull-request' || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Gates the downstream jobs: a standing-PR merge runs only `trigger-publish`, anything else only
  # `update-release-pr`. In parallel, `update-release-pr` could collect the just-released commits
  # as "unreleased" before the dispatched release.yml run finishes tagging.
  detect-release-merge:
    name: Detect release merge
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.detect.outputs.pr_number }}
    steps:
      - name: Checkout config
        uses: actions/checkout@v7
        with:
          sparse-checkout: releasekit.config.json
          sparse-checkout-cone-mode: false

      - name: Find PR for merge commit
        id: detect
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STANDING_PR_BRANCH=$(jq -r '.ci.standingPr.branch // "release/next"' releasekit.config.json)

          # Prefer the squash-merge subject's `(#N)`: GitHub's commits→PRs index is eventually
          # consistent and can return an empty list for ~30s after a merge, whereas a PR lookup by
          # number is immediately stable.
          PR_NUM=""
          SUBJECT=$(printf '%s\n' "$COMMIT_MSG" | head -1)
          if [[ "$SUBJECT" =~ \(#([0-9]+)\)[[:space:]]*$ ]]; then
            CANDIDATE="${BASH_REMATCH[1]}"
            HEAD_REF=$(gh pr view "$CANDIDATE" --repo "$REPO" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
            if [ "$HEAD_REF" = "$STANDING_PR_BRANCH" ]; then
              PR_NUM="$CANDIDATE"
            else
              echo "Subject references PR #$CANDIDATE but its head ref ('$HEAD_REF') is not '$STANDING_PR_BRANCH' — not a standing-PR merge"
            fi
          fi

          if [ -z "$PR_NUM" ]; then
            PRS=""
            for attempt in 1 2 3; do
              if PRS=$(gh api "repos/$REPO/commits/$COMMIT_SHA/pulls" 2>&1); then
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::gh api failed (attempt $attempt/3): $PRS — retrying after ${attempt}s"
                sleep "$attempt"
                PRS=""
              else
                echo "::error::gh api failed after 3 attempts: $PRS"
                exit 1
              fi
            done

            PR_NUM=$(echo "$PRS" | jq --arg branch "$STANDING_PR_BRANCH" -r \
              '[.[] | select(.head.ref == $branch)][0].number // empty')
          fi

          if [ -n "$PR_NUM" ]; then
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
            echo "Detected standing PR merge: PR #$PR_NUM (head: $STANDING_PR_BRANCH)"
          else
            echo "No standing PR merge detected for this push (looking for head: $STANDING_PR_BRANCH)"
          fi

  update-release-pr:
    name: Update Release PR
    needs: detect-release-merge
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.detect-release-merge.outputs.pr_number == ''
    uses: ./.github/workflows/_standing-pr-update.reusable.yml
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  # Re-runs the update on a label change to the OPEN standing PR so overrides apply without waiting
  # for the next push. Separate from update-release-pr, whose detect-release-merge dependency is
  # skipped on pull_request events. The CLI bypasses the skip-pattern guard on label events (the
  # checked-out HEAD is the prep commit).
  update-on-label:
    name: Update Release PR (label change)
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.pull_request.state == 'open' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    uses: ./.github/workflows/_standing-pr-update.reusable.yml
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  # Dispatched to release.yml for the same OIDC reason as `trigger-publish`. `reconcile_after=true`
  # rebuilds the standing PR once the publish succeeds.
  trigger-immediate:
    name: Trigger immediate release via release.yml
    # action == 'closed': a label added to the already-merged PR also satisfies merged == true and
    # would dispatch a second publish.
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release:immediate')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$REPO" \
            --ref main \
            --field packages=all \
            --field bump=auto \
            --field npm_auth=oidc \
            --field sync=true \
            --field dry_run=false \
            --field reconcile_after=true
          echo "Dispatched release.yml for immediate release of PR #$PR_NUMBER"
          echo "Watch publish progress: https://github.com/$REPO/actions/workflows/release.yml"

  # Dispatched rather than published here: npm trusted publishing matches the OIDC token's top-level
  # `workflow_ref`, and the package's single trusted-publisher entry is release.yml, so a publish
  # from this workflow fails with ENEEDAUTH.
  trigger-publish:
    name: Trigger publish via release.yml
    needs: detect-release-merge
    if: needs.detect-release-merge.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.detect-release-merge.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$REPO" \
            --ref main \
            --field "standing_pr_number=$PR_NUMBER"
          echo "Dispatched release.yml with standing_pr_number=$PR_NUMBER"
          echo "Watch publish progress: https://github.com/$REPO/actions/workflows/release.yml"
