# actionlint is static: an example that calls pnpm without pnpm/action-setup (or
# cargo without a rust-toolchain step) lints clean and fails only at runtime.
# examples-smoke.yml catches that class by running each example's real setup on a
# hosted runner.
name: Examples Validate

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'releasekit.schema.json'
      - 'scripts/examples-smoke/**'
      - '.github/workflows/examples-validate.yml'
      - '.github/workflows/examples-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'releasekit.schema.json'
      - 'scripts/examples-smoke/**'
      - '.github/workflows/examples-validate.yml'
      - '.github/workflows/examples-smoke.yml'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint over example workflows
        run: |
          # actionlint auto-detects only .github/workflows, so point it at each
          # example explicitly. Pinned so a new actionlint release can't fail this
          # job out of band.
          ACTIONLINT_VERSION=1.7.12
          bash <(curl -sSf "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          shopt -s globstar nullglob
          files=(examples/**/*.yml examples/**/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example workflows found under examples/ — nothing to lint."
            exit 0
          fi
          ./actionlint -color "${files[@]}"

  config-schema:
    name: config schema (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate each example config against releasekit.schema.json
        run: |
          shopt -s globstar nullglob
          configs=(examples/**/releasekit.config.json)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "No example configs found — nothing to validate."
            exit 0
          fi
          # strict=false: the schema uses a string "default" on a boolean-enum field,
          # which ajv's strict mode rejects as a meta-schema warning, not a data error.
          for cfg in "${configs[@]}"; do
            echo "::group::$cfg"
            npx --yes ajv-cli@5 validate \
              --spec=draft7 \
              --strict=false \
              -s releasekit.schema.json \
              -d "$cfg"
            echo "::endgroup::"
          done

  smoke-drift:
    name: smoke workflow up to date (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify examples-smoke.yml matches the examples
        run: pnpm examples:smoke:check
