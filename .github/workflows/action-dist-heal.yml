name: Action Dist Heal

# Backstop that heals a vX.Y.Z tag left dist-less despite the in-run build (release.yml ->
# _action-release).
#
# Triggers:
#   - workflow_run on a non-success Release run: a run that died mid-build can't heal itself.
#   - schedule: cause-agnostic daily backstop for anything that leaves a green run dist-less.
#
# Not triggered on tag push, and _action-release's dist commit skips CI, so a heal can't loop.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to heal (e.g. v1.2.3)'
        required: true
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    # A successful Release run already committed dist in-run; a skipped one released nothing.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'success' &&
       github.event.workflow_run.conclusion != 'skipped')
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick tag to heal
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          case "$EVENT" in
            workflow_dispatch)
              TAG="$DISPATCH_TAG" ;;
            workflow_run)
              TAG=$(git tag -l --sort=-creatordate 'v[0-9]*.[0-9]*.[0-9]*' | head -1) ;;
            *)
              # Newest stable release: the most consumer-critical tag.
              TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -vE -- '-' | sort -V | tail -1) ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  heal:
    name: Heal action dist
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    uses: ./.github/workflows/_action-release.reusable.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.resolve.outputs.tag }}
    secrets:
      ssh_key: ${{ secrets.DEPLOY_KEY }}
