name: Standing PR Update

# No npm publish or SSH push: the default GITHUB_TOKEN pushes the release branch and creates/updates
# the standing PR.

on:
  workflow_call:
    inputs:
      reconcile:
        description: 'Bypass the skip-pattern guard (set for the post-release reconcile run, where HEAD is a release commit)'
        type: boolean
        required: false
        default: false
    secrets:
      OLLAMA_API_KEY:
        required: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  update:
    name: Update standing PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Setup workspace
        uses: ./.github/workflows/actions/setup-workspace

      - name: Build packages
        run: pnpm build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update standing release PR
        run: node packages/release/dist/cli.js standing-pr update ${{ inputs.reconcile && '--reconcile' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
