name: CI

on:
  push:
    branches: [main]
    tags:
      - '**@v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Run all tests (ignore change detection)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  detect-changes:
    name: Detect Changes
    uses: ./.github/workflows/_ci-detect-changes.reusable.yml
    with:
      force_all: ${{ inputs.force_all || false }}

  build:
    name: Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true' || needs.detect-changes.outputs.run_live == 'true'
    uses: ./.github/workflows/_ci-build.reusable.yml
    with:
      os: ubuntu-latest

  lockfile-validation:
    name: Validate Lockfile
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate lockfile
        run: |
          # pnpm 11+ prepends an env document (pnpm's own version); only the main document has `settings:`.
          main_docs=$(grep -c "^settings:" pnpm-lock.yaml || true)
          all_docs=$(grep -c "^lockfileVersion" pnpm-lock.yaml || true)
          if [ "$main_docs" != "1" ] || [ "$all_docs" -gt 2 ]; then
            echo "ERROR: Lockfile has $all_docs documents, $main_docs main (expected 1 main + optional pnpm env document)"
            exit 1
          fi
          echo "Lockfile validated: $all_docs document(s)"

  action-test-harness:
    name: Action Test Harness
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace

      - name: Download build artifacts
        uses: ./.github/workflows/actions/download-archive
        with:
          name: releasekit-build
          cache_key: ${{ needs.build.outputs.cache_key }}

      - name: Run action test harness (preview)
        run: pnpm test:action:preview

      - name: Run action test harness (release)
        run: pnpm test:action:release

      - name: Run backfill test harness
        run: pnpm test:harness:backfill

      - name: Run multi-registry test harness (npm + cargo)
        run: pnpm test:harness:multi

      - name: Run multi-registry test harness (npm disabled, cargo only)
        run: pnpm test:harness:multi-npm-disabled

  lint:
    name: Lint
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace

      - name: Download build artifacts
        uses: ./.github/workflows/actions/download-archive
        with:
          name: releasekit-build
          cache_key: ${{ needs.build.outputs.cache_key }}

      - name: Run lint
        run: pnpm lint

      - name: Check generated JSON schema is up to date
        run: pnpm schema:check

      - name: Check generated config docs are up to date
        run: pnpm docs:check

  typecheck:
    name: Typecheck
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Development Environment
        uses: ./.github/workflows/actions/setup-workspace

      - name: Download build artifacts
        uses: ./.github/workflows/actions/download-archive
        with:
          name: releasekit-build
          cache_key: ${{ needs.build.outputs.cache_key }}

      - name: Run typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    uses: ./.github/workflows/_ci-unit.reusable.yml
    with:
      os: ubuntu-latest
      cache_key: ${{ needs.build.outputs.cache_key }}
      node-version: ${{ matrix.node-version }}

  integration-tests:
    name: Integration Tests
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    uses: ./.github/workflows/_ci-integration.reusable.yml
    with:
      cache_key: ${{ needs.build.outputs.cache_key }}
      node-version: ${{ matrix.node-version }}

  package-tests:
    name: Package Tests
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/_ci-package-tests.reusable.yml
    with:
      os: ${{ matrix.os }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  e2e-tests:
    name: E2E Tests
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/_ci-e2e.reusable.yml
    with:
      os: ${{ matrix.os }}
      cache_key: ${{ needs.build.outputs.cache_key }}

  live-tests:
    name: Live Tests
    needs: [detect-changes, build]
    # Skip forks (no secrets) and the standing release PR (version bumps only).
    if: >-
      needs.detect-changes.outputs.run_live == 'true' &&
      github.head_ref != 'release/next' &&
      github.repository == 'goosewobbler/releasekit' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/_ci-live.reusable.yml
    with:
      cache_key: ${{ needs.build.outputs.cache_key }}
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  ci-status:
    name: CI Status
    if: always()
    needs:
      - detect-changes
      - build
      - lockfile-validation
      - action-test-harness
      - lint
      - typecheck
      - unit-tests
      - integration-tests
      - package-tests
      - e2e-tests
      - live-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "CI failed: found job with result '$result'"
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped"
