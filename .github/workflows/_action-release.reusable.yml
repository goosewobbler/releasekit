name: Action Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      ssh_key:
        required: true

permissions:
  contents: write

jobs:
  build-action:
    name: Build and tag action dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.ssh_key }}
          ref: ${{ inputs.tag }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Skip if dist already committed on the tag
        id: guard
        run: |
          # Idempotent so action-dist-heal.yml can reuse this job: a fresh release tag points at a
          # dist-less commit (proceed); a healed one points at the dist commit (no-op), so re-runs on
          # the force-moved tag can't loop or double-commit. If the action's entry point moves, update
          # this path, or every scheduled heal rebuilds and re-moves the tag.
          if git cat-file -e "HEAD:packages/release/dist/cli.js" 2>/dev/null; then
            echo "already_healed=true" >> "$GITHUB_OUTPUT"
            echo "dist already committed on ${{ inputs.tag }} — skipping (no-op)."
          else
            echo "already_healed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup workspace
        if: steps.guard.outputs.already_healed != 'true'
        uses: ./.github/workflows/actions/setup-workspace

      - name: Build packages
        if: steps.guard.outputs.already_healed != 'true'
        run: pnpm build

      - name: Commit dist and tag
        if: steps.guard.outputs.already_healed != 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry only network/API ops: a transient push rejection or API blip shouldn't strand a
          # dist-less tag. Local git ops fail deterministically and should surface.
          retry() {
            local -r what="$*"
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::failed after 3 attempts: ${what}"
                return 1
              fi
              echo "attempt ${n}/3 failed: ${what} — retrying in $((n * 5))s"
              sleep "$((n * 5))"
              n=$((n + 1))
            done
          }

          git add -f packages/release/dist/
          git commit --no-verify -m "chore: build action dist for ${RELEASE_TAG} [skip ci]"

          VERSION="${RELEASE_TAG#v}"
          MAJOR="${VERSION%%.*}"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping"
          else
            if [[ "${VERSION}" != *"-"* ]]; then
              retry gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
            else
              retry gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --prerelease
            fi
          fi

          # Consumers pinning `uses: goosewobbler/releasekit@v1.2.3` must get the built dist.
          git tag -f "v${VERSION}"
          retry git push origin -f "v${VERSION}"

          if [[ "${VERSION}" != *"-"* ]]; then
            git tag -f "v${MAJOR}"
            retry git push origin -f "v${MAJOR}"
          else
            echo "Prerelease ${VERSION} — skipping major alias update"
          fi
