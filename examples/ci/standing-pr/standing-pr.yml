# Copy to: .github/workflows/standing-pr.yml
#
# One-time repo setting (REQUIRED): Settings -> Actions -> General ->
# Workflow permissions -> enable "Allow GitHub Actions to create and approve
# pull requests". Without it the first `standing-pr update` fails with HTTP 403;
# the pull-requests: write permission below is necessary but not sufficient.
# The toggle also lets any workflow token approve PRs. Before relying on a
# "≥ 1 approval" ruleset, see
# https://github.com/goosewobbler/releasekit/blob/main/packages/release/docs/ci-setup.md#workflow-token-approvals
#
# One-time environment (REQUIRED): Settings -> Environments -> New environment
# `release`, with deployment branches restricted to `main` and no required
# reviewers. Every job that writes runs in it, updates included, so registry
# secrets and the optional GitHub App's secrets reach only runs on `main`. See
# https://github.com/goosewobbler/releasekit/blob/main/packages/release/docs/ci-setup.md#the-release-environment
#
# Exempt the release branch (release/*) from your build/test CI, or every update
# re-runs your whole matrix. See
# https://github.com/goosewobbler/releasekit/blob/main/packages/release/docs/ci-setup.md#keeping-ci-off-the-standing-pr
name: Standing Release PR

on:
  push:
    branches: [main]
  pull_request:
    # Only the relay job runs on these: it dispatches the work on main, where the `release` environment's secrets are.
    types: [labeled, unlabeled, edited]
    branches: [main]
  schedule:
    - cron: '0 * * * *' # advances the minAge status check as time passes
  workflow_dispatch:
    inputs:
      pr:
        description: 'Merged standing PR to publish again, as release:retry does. Leave empty to update the standing PR.'
        type: string
        default: ''
      edited:
        description: 'Cancel an update in progress, as a checkbox edit does'
        type: boolean
        default: false

permissions: {}

jobs:
  relay:
    name: Relay to main
    # `sender.type != 'Bot'` stops the update's own body rewrite (an `edited` event) re-triggering it forever; matching
    # on type rather than login also covers the App. The `release/` prefix and the label names in this file are
    # hardcoded (workflow `if` can't read config); in-step config is authoritative.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      (
        (github.event.pull_request.state == 'open' && github.event.sender.type != 'Bot') ||
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'release:retry' &&
          github.event.pull_request.merged == true
        )
      )
    permissions:
      actions: write # start this workflow on main
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch on main
        run: |
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          if [ "$MERGED" = true ]; then
            gh workflow run "${workflow##*/}" --ref "$BASE_REF" -f pr="$PR"
          else
            gh workflow run "${workflow##*/}" --ref "$BASE_REF" -f edited="$EDITED"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          EDITED: ${{ github.event.action == 'edited' }}

  detect:
    name: Detect Release
    # Only a release job can replace a queued release, so a feeder push mustn't start one. The release job's CLI steps
    # decide what publishes.
    if: github.event_name == 'push'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.merged.outputs.publish }}
      immediate: ${{ steps.merged.outputs.immediate }}
    steps:
      - name: Read the PR merged as this commit
        id: merged
        run: |
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'map(select(.merged_at != null))')
          echo "publish=$(jq 'any(.[]; .head.ref | startswith("release/"))' <<<"$prs")" >> "$GITHUB_OUTPUT"
          echo "immediate=$(jq 'any(.[]; (.head.ref | startswith("release/") | not) and any(.labels[]; .name == "release:immediate"))' <<<"$prs")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  update:
    name: Update Release PR
    needs: detect
    # An immediate release's push is left to the reconcile job, so the standing PR doesn't offer what it publishes.
    if: >-
      !cancelled() &&
      needs.detect.outputs.immediate != 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.pr == '')
      )
    environment: release
    # GitHub replaces a group's pending job with any newer one, which is safe for rebuilds because an update gives the
    # same result whatever started it. A checkbox edit also cancels the one in progress, so rapid ticks collapse to one.
    concurrency:
      group: standing-release-pr
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.edited }}
    permissions:
      contents: write # push to release/next
      pull-requests: write # create/update/close the standing PR and its comments
      statuses: write # post the releasekit/standing-pr status check
    env:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        # `if` can't read secrets, hence the job's RELEASE_APP_ID env. Without it, every step uses GITHUB_TOKEN.
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Use the App's git identity
        # So commits and tags name the account that pushes them.
        if: steps.app-token.outputs.app-slug != ''
        run: |
          name="${SLUG}[bot]"
          id=$(gh api "/users/$name" --jq .id)
          git config user.name "$name"
          git config user.email "$id+$name@users.noreply.github.com"
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update standing release PR
        # --ack shows an in-progress banner on the standing PR while a relayed label or checkbox change is applied.
        run: pnpm exec releasekit standing-pr update --ack
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # LLM key only needed when using the release:preview-notes label (optional).
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  release:
    name: Release
    needs: detect
    # A merged `release:immediate` PR runs it too, to publish any standing release still waiting for its tags first.
    if: >-
      !cancelled() &&
      (
        needs.detect.outputs.publish == 'true' ||
        needs.detect.outputs.immediate == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.pr != '')
      )
    environment: release
    # No update joins this group, so none can replace a queued release.
    concurrency: standing-release
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      id-token: write # npm OIDC trusted publishing
    env:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Find the standing release
        id: target
        # On a push, the merged standing PR still missing its tags, so it still publishes when a newer push's run
        # replaced the merge's own. The publish refuses any checkout but its merge commit.
        run: |
          pnpm exec releasekit standing-pr resolve ${PR:+--pr "$PR"} --output "$RUNNER_TEMP/target.json"
          echo "pr=$(jq -r '.data.pr // empty' "$RUNNER_TEMP/target.json")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.data.mergeSha // empty' "$RUNNER_TEMP/target.json")" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

      - name: Check out its merge commit
        if: steps.target.outputs.sha != '' && steps.target.outputs.sha != github.sha
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - if: steps.target.outputs.sha != '' && steps.target.outputs.sha != github.sha
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Use the App's git identity
        if: steps.app-token.outputs.app-slug != ''
        run: |
          name="${SLUG}[bot]"
          id=$(gh api "/users/$name" --jq .id)
          git config user.name "$name"
          git config user.email "$id+$name@users.noreply.github.com"
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish from standing release PR
        if: steps.target.outputs.sha != ''
        run: pnpm exec releasekit standing-pr publish --pr "$PR"
        env:
          PR: ${{ steps.target.outputs.pr }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # only if not using OIDC
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

      - name: Remove retry label
        # Each application is exactly one retry; re-apply the label to retry again.
        if: always() && inputs.pr != ''
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/release%3Aretry" || true
        env:
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

  immediate:
    name: Immediate Release
    needs: [detect, release]
    # A job of its own after `release`: it mustn't bump on top of an untagged standing release, and must build the
    # pushed commit, not that release's merge commit.
    if: needs.detect.outputs.immediate == 'true' && needs.release.result == 'success'
    environment: release
    concurrency: standing-release
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      id-token: write # npm OIDC trusted publishing
    env:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Use the App's git identity
        if: steps.app-token.outputs.app-slug != ''
        run: |
          name="${SLUG}[bot]"
          id=$(gh api "/users/$name" --jq .id)
          git config user.name "$name"
          git config user.email "$id+$name@users.noreply.github.com"
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Direct release (bypassing standing PR)
        # The CLI reads the merged PR and its labels for the pushed commit from GitHub.
        run: pnpm exec releasekit release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # only if not using OIDC
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  reconcile:
    name: Reconcile Release PR
    needs: [release, immediate]
    if: >-
      !cancelled() &&
      needs.release.result == 'success' &&
      needs.immediate.result != 'failure'
    environment: release
    # The rebuild group, so it queues with the updates rather than racing them.
    concurrency:
      group: standing-release-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Use the App's git identity
        if: steps.app-token.outputs.app-slug != ''
        run: |
          name="${SLUG}[bot]"
          id=$(gh api "/users/$name" --jq .id)
          git config user.name "$name"
          git config user.email "$id+$name@users.noreply.github.com"
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Update standing release PR
        # Rebuilds now, e.g. to offer graduation of the prereleases that just shipped. `--reconcile` because main's tip
        # is now a release commit, which a plain update skips.
        run: pnpm exec releasekit standing-pr update --reconcile
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # LLM key only needed when using the release:preview-notes label (optional).
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
