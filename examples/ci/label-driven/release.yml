# Copy to: .github/workflows/release.yml
#
# A merged PR releases only when it carries a `bump:*` label, which decides the
# magnitude; conventional commits still determine the changelog.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write # npm OIDC trusted publishing
  pull-requests: read # gate reads the merged PR's labels

jobs:
  release:
    runs-on: ubuntu-latest
    # Workflow `if` can't read config, so the label names are hardcoded to
    # releasekit's defaults. `releasekit release` re-reads ci.labels and is the
    # authoritative check - keep the two in sync if you customise the names.
    if: >
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'bump:patch') ||
       contains(github.event.pull_request.labels.*.name, 'bump:minor') ||
       contains(github.event.pull_request.labels.*.name, 'bump:major'))
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # setup-node's registry-url writes a .npmrc with `_authToken=${NODE_AUTH_TOKEN}`.
      # With OIDC that var is empty, so npm fails ENEEDAUTH instead of the OIDC exchange.
      # (Drop this step if you publish with NODE_AUTH_TOKEN.)
      - name: Remove token-based .npmrc so OIDC can take over
        run: rm -f .npmrc

      - run: pnpm exec releasekit release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # only if not using OIDC
