# Copy to: .github/workflows/release.yml
#
# npm OIDC trusted publishing: no NPM_TOKEN secret.
#
# Requirements:
#   - npm >= 9.5.0 (Node 24 ships a newer npm, so setup-node@v6 is fine).
#   - Each package has an npm "Automation" trusted publisher configured:
#     npmjs.com -> package Settings -> Trusted publishing -> add a GitHub
#     Actions publisher for THIS repo and THIS workflow filename.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # REQUIRED for OIDC: mints the OIDC token
  pull-requests: read # releasekit release reads the merged PR's labels

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Release
        run: pnpm exec releasekit release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
